name: static-analysis

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: "1.12.3.1577"
          # Pinned, not latest: a newer kondo finds NEW things, which is good
          # but must be a deliberate bump, not a surprise mid-PR.
          # Matches the version the tree was driven to zero against locally.
          clj-kondo: 2025.07.28

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}

      # Zero-warning contract: warnings are failed contracts.
      - name: clj-kondo
        run: clj-kondo --lint src test --fail-level warning

      # typed.clojure over the checked (pure, non-EDN-boundary) namespaces.
      - name: typecheck
        run: |
          clojure -M:typecheck -e \
            "(require 'typed.clj.checker)(typed.clj.checker/check-ns 'shx.shape.quote)(println \"typecheck OK\")"
